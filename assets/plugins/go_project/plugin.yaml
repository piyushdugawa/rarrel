name: go-project
version: "1.0.0"

prompts:
  - name: project_name
    message: "Enter project name"
    type: string

  - name: module_path
    message: Enter module path"
    type: string

tools:
  - name: go
    required: true
    version: ">=1.24"
    
  - name: git
    required: false
    version: "inherit"

templates:
  - source: templates/go.mod.tmpl
    destination: go.mod

  - source: templates/main.go.tmpl
    destination: main.go

  - source: templates/justfile.tmpl
    destination: justfile